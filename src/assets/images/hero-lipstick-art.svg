<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="هنر تجاری رژ لب لوکس">
  <defs>
    <!-- Deep plum -> rose background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1725"/>
      <stop offset="45%" stop-color="#590826"/>
      <stop offset="100%" stop-color="#8f1240"/>
    </linearGradient>
    <!-- Lipstick bullet velvet red -->
    <linearGradient id="bullet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7fa0"/>
      <stop offset="45%" stop-color="#ff3f7b"/>
      <stop offset="100%" stop-color="#b81c4e"/>
    </linearGradient>
    <!-- Gold tube -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8d98a"/>
      <stop offset="35%" stop-color="#e0a541"/>
      <stop offset="60%" stop-color="#f6e3a8"/>
      <stop offset="100%" stop-color="#b8862b"/>
    </linearGradient>
    <!-- Rose gold tube -->
    <linearGradient id="rosegold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9c9"/>
      <stop offset="40%" stop-color="#e8a78c"/>
      <stop offset="70%" stop-color="#f7d3c0"/>
      <stop offset="100%" stop-color="#c97a5e"/>
    </linearGradient>
    <!-- Berry bullet -->
    <linearGradient id="bullet2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c18093"/>
      <stop offset="50%" stop-color="#7a2e4e"/>
      <stop offset="100%" stop-color="#451430"/>
    </linearGradient>
    <!-- Nude bullet -->
    <linearGradient id="bullet3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd7d0"/>
      <stop offset="100%" stop-color="#d8a8b5"/>
    </linearGradient>
    <!-- Silk wave -->
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3f7b" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#ff7fa0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffa8be" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.72" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ff7fa0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7fa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd9e4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd9e4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="smallBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>

  <!-- Bokeh orbs -->
  <g filter="url(#softBlur)">
    <circle cx="1280" cy="200" r="120" fill="#ff5c88" opacity="0.45"/>
    <circle cx="1420" cy="640" r="170" fill="#ff7fa0" opacity="0.30"/>
    <circle cx="1050" cy="780" r="140" fill="#e02963" opacity="0.35"/>
    <circle cx="330" cy="180" r="110" fill="#c18093" opacity="0.30"/>
    <circle cx="180" cy="640" r="150" fill="#ff3f7b" opacity="0.22"/>
  </g>
  <g>
    <circle cx="1200" cy="330" r="60" fill="url(#glowOrb)"/>
    <circle cx="1330" cy="470" r="38" fill="url(#glowOrb)"/>
    <circle cx="980" cy="180" r="26" fill="#ffe1ea" opacity="0.55"/>

  <!-- Large artistic lips imprint (soft, decorative) -->
  <g transform="translate(1180 430) rotate(-14) scale(2.1)" opacity="0.16" filter="url(#smallBlur)">
    <path d="M -70 -6 C -40 -34 -14 -34 0 -14 C 14 -34 40 -34 70 -6 C 42 22 14 30 0 16 C -14 30 -42 22 -70 -6 Z" fill="#ff7fa0"/>
  </g>

  <!-- Lipstick group: center luxury tube (gold) -->
  <g transform="translate(1010 0)">
    <!-- reflection -->
    <ellipse cx="90" cy="812" rx="120" ry="20" fill="#2b1725" opacity="0.55" filter="url(#smallBlur)"/>
    <!-- tube body -->
    <rect x="30" y="470" width="120" height="330" rx="18" fill="url(#gold)"/>
    <rect x="30" y="470" width="26" height="330" rx="13" fill="#ffffff" opacity="0.28"/>
    <rect x="124" y="470" width="26" height="330" rx="13" fill="#000000" opacity="0.16"/>
    <!-- band -->
    <rect x="26" y="452" width="128" height="30" rx="10" fill="#8f1240"/>
    <!-- bullet -->
    <path d="M 42 452 L 138 452 L 138 300 Q 90 216 42 300 Z" fill="url(#bullet)"/>
    <path d="M 42 452 L 138 452 L 138 300 Q 90 216 42 300 Z" fill="none" stroke="#ffd9e4" stroke-opacity="0.35" stroke-width="3"/>
    <!-- bullet sheen -->
    <path d="M 58 430 L 58 312 Q 74 268 86 258 L 86 430 Z" fill="#ffffff" opacity="0.30"/>
    <!-- crown tip highlight -->
    <circle cx="90" cy="246" r="10" fill="#ffe1ea" opacity="0.85"/>
  </g>

  <!-- Lipstick group: left rose-gold short tube (angled) -->
  <g transform="translate(800 120) rotate(-9)">
    <ellipse cx="86" cy="706" rx="104" ry="18" fill="#2b1725" opacity="0.5" filter="url(#smallBlur)"/>
    <rect x="32" y="400" width="108" height="300" rx="16" fill="url(#rosegold)"/>
    <rect x="32" y="400" width="22" height="300" rx="11" fill="#ffffff" opacity="0.26"/>
    <rect x="28" y="384" width="116" height="26" rx="9" fill="#590826"/>
    <path d="M 42 384 L 130 384 L 130 258 Q 86 186 42 258 Z" fill="url(#bullet2)"/>
    <path d="M 56 366 L 56 268 Q 70 230 80 218 L 80 366 Z" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Lipstick group: right nude slim tube (angled) -->
  <g transform="translate(1270 170) rotate(12)">
    <ellipse cx="70" cy="640" rx="92" ry="16" fill="#2b1725" opacity="0.5" filter="url(#smallBlur)"/>
    <rect x="26" y="360" width="92" height="280" rx="14" fill="url(#gold)"/>
    <rect x="26" y="360" width="18" height="280" rx="9" fill="#ffffff" opacity="0.24"/>
    <rect x="22" y="344" width="100" height="24" rx="8" fill="#8f1240"/>
    <path d="M 38 344 L 106 344 L 106 232 Q 72 170 38 232 Z" fill="url(#bullet3)"/>
    <path d="M 50 328 L 50 242 Q 62 208 70 198 L 70 328 Z" fill="#ffffff" opacity="0.30"/>
  </g>

  <!-- Open lipstick compact / palette disc bottom-left -->
  <g transform="translate(210 560)">
    <ellipse cx="120" cy="150" rx="120" ry="34" fill="#1f101c" opacity="0.5" filter="url(#smallBlur)"/>
    <circle cx="120" cy="130" r="104" fill="#451430"/>
    <circle cx="120" cy="126" r="86" fill="url(#bullet)" opacity="0.9"/>
    <circle cx="120" cy="126" r="86" fill="none" stroke="#ffd9e4" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="96" cy="104" r="20" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffe1ea">
    <path d="M 920 300 l 6 18 l 18 6 l -18 6 l -6 18 l -6 -18 l -18 -6 l 18 -6 Z" opacity="0.9"/>
    <path d="M 1400 380 l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 l 14 -5 Z" opacity="0.7"/>
    <path d="M 760 240 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z" opacity="0.65"/>
    <path d="M 1500 560 l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 l 14 -5 Z" opacity="0.55"/>
    <path d="M 640 420 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z" opacity="0.5"/>
    <path d="M 470 250 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z" opacity="0.45"/>
  </g>

  <!-- Fine grain dots -->
  <g fill="#ffd9e4" opacity="0.35">
    <circle cx="620" cy="150" r="3"/>
    <circle cx="880" cy="120" r="2.5"/>
    <circle cx="1120" cy="90" r="3"/>
    <circle cx="1360" cy="150" r="2"/>
    <circle cx="420" cy="420" r="2.5"/>
    <circle cx="560" cy="620" r="3"/>
    <circle cx="1240" cy="700" r="2.5"/>
    <circle cx="1520" cy="720" r="3"/>
    <circle cx="380" cy="120" r="2"/>
  </g>

  <!-- Soft vignette for text side -->
  <rect x="0" y="0" width="760" height="900" fill="#2b1725" opacity="0.22"/>
</svg>

    <circle cx="1460" cy="260" r="18" fill="#ffe1ea" opacity="0.5"/>
    <circle cx="900" cy="640" r="20" fill="#ffe1ea" opacity="0.4"/>
    <circle cx="250" cy="330" r="16" fill="#ffd9e4" opacity="0.5"/>
  </g>

  <!-- Silk ribbon waves -->
  <path d="M -100 700 C 300 560, 500 820, 900 660 S 1500 520, 1750 680 L 1750 950 L -100 950 Z" fill="url(#silk)"/>
  <path d="M -100 780 C 350 660, 560 900, 980 740 S 1560 620, 1750 780 L 1750 960 L -100 960 Z" fill="url(#silk)" opacity="0.7"/>
  <path d="M -100 860 C 400 760, 620 980, 1060 840 S 1600 740, 1750 880 L 1750 980 L -100 980 Z" fill="#590826" opacity="0.45"/>
</svg>
